# yaml-language-server: $schema=../../../schemas/feature.json
id: MK-SECRETS-001
title: "Secrets: local encrypted vault (mk secrets), agent approvals, output redaction, secret-file guard, mk-vault skill"
area: security
priority: high
state: active
verification_level: contract
trigger:
  type: user_request
  summary: "Owner decided max-kit should have its own vault (2026-11-27); Phase 6 security of docs/plan.md."
behavior: >
  Values enter only through stdin, a file or a hidden prompt, are stored AES-256-GCM encrypted with the key in the OS
  keychain, and never print: get shows [redacted] and a hint, compare answers match or differs, the audit log holds no
  values. Agents use a secret only through mk secrets run after the user approves in their own terminal; output is
  redacted. The secrets guard blocks agent reads of .env and key files in Claude Code and Codex.
acceptance:
  - id: AC1
    then: no command output, vault file or audit entry contains a stored value
  - id: AC2
    then: under an agent, run needs a user grant scoped to ref, program and variable; once grants are used up; approve and reveal refuse under an agent
  - id: AC3
    then: the guard denies reading .env, .pem and key files and printenv, and allows .env.example
watch:
  - src/secrets/
  - src/guards/secrets.mjs
  - src/cli/secrets.mjs
verification:
  mode: automated
  commands:
    - run: npm test
      covers: [AC1, AC2, AC3]
    - run: npm run check
  expected_result: "All tests pass including test/secrets.test.mjs; check passed."
evidence: []
unknowns: []
updated_at: 2026-11-27

# yaml-language-server: $schema=../../../schemas/feature.json
id: MK-PACKS-001
title: "Skill packs and port tooling: mk alias, pack loading and rendering, skills lint, port script"
area: packs
priority: high
state: active
verification_level: contract
trigger:
  type: user_request
  summary: "Move the owner's existing agent kit into max-kit as opt-in mk-* packs (docs/skills-migration.md, batch 0)."
behavior: >
  Knowledgebases enable packs in the config; sync renders their skills and agents for Claude and Codex, follows
  requires, prunes files of disabled packs and reports unknown packs. The port script renames to mk-, maps exact CLI
  equivalents, removes the owner's notices and keeps third-party ones; skills lint rejects dead commands, unknown mk-
  references, wrong names, oversize skills and forbidden source names.
acceptance:
  - id: AC1
    then: enabled packs render for both runtimes and disabled packs are pruned
  - id: AC2
    then: the port script output has no source names and keeps third-party notices
  - id: AC3
    then: skills lint rejects dead mk commands and unknown mk- references
watch:
  - src/core/skills-lint.mjs
  - src/cli/sync.mjs
  - scripts/port-skills.mjs
verification:
  mode: automated
  commands:
    - run: npm test
      covers: [AC1, AC2, AC3]
    - run: npm run check
  expected_result: "All tests pass including test/packs.test.mjs; check passed (includes skills lint)."
evidence: []
unknowns: []
updated_at: 2026-11-27
